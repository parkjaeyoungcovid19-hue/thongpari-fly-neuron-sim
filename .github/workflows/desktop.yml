name: Linux and Windows desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
      TEST_ARTIFACT_DIR: work/test-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            desktop_lab/requirements.txt
            flygym_bridge/requirements.txt
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install Linux desktop
        if: runner.os == 'Linux'
        run: ./setup_linux.sh
      - name: Install Windows desktop
        if: runner.os == 'Windows'
        shell: cmd
        env:
          THONGPARI_PYTHON: python
        run: setup_windows.cmd
      - name: Core, native process lifetime and desktop smoke tests
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          python = pathlib.Path('flygym-venv') / ('Scripts/python.exe' if sys.platform == 'win32' else 'bin/python')
          subprocess.run([str(python), '-m', 'unittest', 'desktop_lab.tests.test_brain', 'desktop_lab.tests.test_session', 'desktop_lab.tests.test_process_lifetime', 'desktop_lab.tests.test_platform_support', 'desktop_lab.tests.test_desktop.DesktopTests.test_mock_desktop_full_brain_pause_and_shutdown', '-v'], check=True)
          subprocess.run([str(python.resolve()), '-m', 'unittest', 'discover', '-s', 'tests/unit'], cwd='flygym_bridge', check=True)
      - name: Real MuJoCo desktop workflow (Linux software rendering)
        if: runner.os == 'Linux'
        env:
          MUJOCO_GL: egl
          PYOPENGL_PLATFORM: egl
        run: ./flygym-venv/bin/python -m unittest desktop_lab.tests.test_desktop.DesktopTests.test_real_desktop_edit_input_pause_record_and_shutdown -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ runner.os }}
          path: work/test-artifacts
          if-no-files-found: ignore
